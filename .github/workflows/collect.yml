name: FA 소식 수집

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 사정에 따라 몇 분 늦어질 수 있음)
  workflow_dispatch: {}      # Actions 탭에서 손으로도 실행 가능

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/collect.py

      - name: 새 글이 있으면 커밋
        run: |
          if git diff --quiet -- docs/data/news.json; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "kbo-fa-feed bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/news.json
          git commit -m "소식 갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
